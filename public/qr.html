<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiPase UAC</title>
  <style>
    :root {
      color-scheme: light;
      --uac-red: #c4112a;
      --uac-red-dark: #960c20;
      --uac-gold: #f4c400;
      --text: #1b2430;
      --muted: #667085;
      --surface: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 10%, rgba(244,196,0,.20), transparent 28%),
        linear-gradient(145deg, var(--uac-red-dark), var(--uac-red));
    }

    .card {
      width: min(420px, 100%);
      padding: 30px;
      border-top: 6px solid var(--uac-gold);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: 0 24px 60px rgba(43, 0, 8, .30);
      text-align: center;
    }

    .logo {
      width: 82px;
      height: 82px;
      object-fit: contain;
    }

    h1 {
      margin: 10px 0 4px;
      color: var(--uac-red-dark);
      font-size: 1.5rem;
    }

    .subtitle, .person-role, #timer, #message {
      color: var(--muted);
    }

    .form {
      margin-top: 24px;
    }

    input, button {
      width: 100%;
      min-height: 48px;
      border-radius: 12px;
      font: inherit;
    }

    input {
      padding: 0 14px;
      border: 1px solid #d0d5dd;
      outline: none;
    }

    input:focus {
      border-color: var(--uac-red);
      box-shadow: 0 0 0 4px rgba(196,17,42,.12);
    }

    button {
      margin-top: 12px;
      border: 0;
      color: white;
      background: var(--uac-red);
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: .65;
    }

    #qrView[hidden] { display: none; }

    .person-name {
      margin: 18px 0 2px;
      font-size: 1.3rem;
    }

    .person-role {
      margin: 0 0 14px;
      font-weight: 600;
    }

    .qr-shell {
      display: grid;
      place-items: center;
      min-height: 332px;
      padding: 6px;
      border: 2px solid #eceff3;
      border-radius: 18px;
      background: white;
    }

    #qrImage {
      display: block;
      width: min(320px, 100%);
      aspect-ratio: 1;
    }

    #timer {
      margin: 12px 0 0;
      font-weight: 700;
    }

    #message {
      min-height: 22px;
      margin: 12px 0 0;
    }

    #message.error { color: #b42318; }
  </style>
</head>
<body>
  <main class="card">
    <img src="img/logo1.png" class="logo" alt="Universidad Autónoma del Caribe">
    <h1>MiPase UAC</h1>
    <p class="subtitle">Código dinámico de acceso institucional</p>

    <section id="loginBox" class="form">
      <label for="cedulaInput" class="subtitle">Identificación</label>
      <input id="cedulaInput" inputmode="numeric" autocomplete="off"
             placeholder="Ingresa tu número" aria-describedby="message">
      <button id="loginButton" type="button">Generar mi código QR</button>
    </section>

    <section id="qrView" hidden>
      <h2 id="nombre" class="person-name"></h2>
      <p id="personaInfo" class="person-role"></p>
      <div class="qr-shell">
        <img id="qrImage" alt="Código QR temporal de MiPase">
      </div>
      <p id="timer" aria-live="polite"></p>
    </section>

    <p id="message" role="status" aria-live="polite"></p>
  </main>

  <script>
    "use strict";

    const loginBox = document.getElementById("loginBox");
    const loginButton = document.getElementById("loginButton");
    const cedulaInput = document.getElementById("cedulaInput");
    const qrView = document.getElementById("qrView");
    const qrImage = document.getElementById("qrImage");
    const nombre = document.getElementById("nombre");
    const personaInfo = document.getElementById("personaInfo");
    const timer = document.getElementById("timer");
    const message = document.getElementById("message");

    let cedula = "";
    let secondsRemaining = 30;
    let refreshTimer = null;
    let countdownTimer = null;
    let requestInProgress = false;

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.classList.toggle("error", isError);
    }

    async function requestQr({ initial = false } = {}) {
      if (requestInProgress) return;
      requestInProgress = true;
      loginButton.disabled = true;

      try {
        const response = await fetch("/api/qr", {
          method: "POST",
          cache: "no-store",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ cedula }),
        });
        const data = await response.json();

        if (!response.ok || !data.ok) {
          throw new Error(data.mensaje || "No fue posible generar el código QR.");
        }

        qrImage.src = data.qrDataUrl;
        nombre.textContent = data.persona.nombre || `ID ${data.persona.personaId}`;
        const visitorExpiration = Number(data.persona.expiracion);
        const validity = Number.isFinite(visitorExpiration) && visitorExpiration > 0
          ? `Vigente hasta ${new Intl.DateTimeFormat("es-CO", {
              dateStyle: "medium",
              timeStyle: "short",
              timeZone: "America/Bogota"
            }).format(new Date(visitorExpiration))}`
          : "";
        personaInfo.textContent = [
          data.persona.rol,
          data.persona.carrera,
          validity,
        ].filter(Boolean).join(" · ");

        loginBox.hidden = true;
        qrView.hidden = false;
        secondsRemaining = data.renuevaEnSegundos || 30;
        timer.textContent = `El código se renueva en ${secondsRemaining} segundos`;
        showMessage(initial ? "Código generado correctamente." : "Código renovado.");
      } catch (error) {
        showMessage(error.message, true);
        if (initial) {
          loginBox.hidden = false;
          qrView.hidden = true;
        }
      } finally {
        requestInProgress = false;
        loginButton.disabled = false;
      }
    }

    function startTimers() {
      clearInterval(refreshTimer);
      clearInterval(countdownTimer);

      countdownTimer = setInterval(() => {
        secondsRemaining = Math.max(0, secondsRemaining - 1);
        timer.textContent = `El código se renueva en ${secondsRemaining} segundos`;
      }, 1000);

      refreshTimer = setInterval(() => requestQr(), 30_000);
    }

    async function login() {
      const candidate = cedulaInput.value.trim();
      if (!/^\d+$/.test(candidate)) {
        showMessage("Ingresa una identificación numérica válida.", true);
        cedulaInput.focus();
        return;
      }

      cedula = candidate;
      showMessage("Generando código seguro…");
      await requestQr({ initial: true });
      if (!qrView.hidden) startTimers();
    }

    loginButton.addEventListener("click", login);
    cedulaInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") login();
    });

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && cedula && !qrView.hidden) {
        requestQr();
      }
    });

    const cedulaFromLink = new URLSearchParams(window.location.search)
      .get("cedula");
    if (cedulaFromLink && /^\d+$/.test(cedulaFromLink)) {
      cedulaInput.value = cedulaFromLink;
      login();
    }
  </script>
</body>
</html>
